name: Import Places — Lombardia (SIRBeC ArcGIS → dtrek_places, meta_type=sito)

# Manuale (workflow_dispatch), stesso schema di import-places-mic.yml — leggere quel file e
# scripts/places/lombardia/README.md prima di modificare questo.
#
# `probe` resta la diagnostica sulle fonti candidate (scripts/places/lombardia/probe.ts, due round
# già eseguiti dal vivo — vedi README "Stato"). `describe`/`dry-run`/`write` usano invece
# scripts/places/lombardia/fetch.ts, la fonte scelta dopo quei due round (layer ArcGIS
# cultura/LBL_GEO, 651 record verificati in tutta la regione, 70 nel solo Comune di Milano).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe: test isolato degli endpoint candidati (diagnostica, vedi probe.ts). describe: dump di un record ArcGIS reale. dry-run: solo log, nessuna scrittura. write: importa davvero in Supabase."
        required: true
        type: choice
        options:
          - probe
          - describe
          - dry-run
          - write
        default: dry-run
      limit:
        description: "Numero massimo di record ArcGIS da importare (dry-run/write). La regione intera è 651 record verificati (round 2) — il default copre tutto."
        required: false
        type: string
        default: "5000"
      describe_name:
        description: "Solo modalità describe: testo da cercare in DENOMINAZIONE (es. 'Museo Archeologico') invece di un record arbitrario."
        required: false
        type: string
        default: ""
      probe_only:
        description: "Solo modalità probe: nome di un singolo probe da probe.ts (vuoto = tutti). Vedi il file per l'elenco completo (round 1 e round 2)."
        required: false
        type: string
        default: ""
      probe_timeout_ms:
        description: "Solo modalità probe: timeout (ms) per ciascun probe — un solo tentativo, nessuna retry."
        required: false
        type: string
        default: "30000"

concurrency:
  group: import-places
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode }}
      LIMIT: ${{ inputs.limit }}
      DESCRIBE_NAME: ${{ inputs.describe_name }}
      PROBE_ONLY: ${{ inputs.probe_only }}
      PROBE_TIMEOUT_MS: ${{ inputs.probe_timeout_ms }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Probe — test degli endpoint candidati (diagnostica, nessun Supabase)
        if: ${{ inputs.mode == 'probe' }}
        run: |
          set -euo pipefail
          if [ -n "${PROBE_ONLY:-}" ]; then
            npx tsx scripts/places/lombardia/probe.ts --timeout "$PROBE_TIMEOUT_MS" --only "$PROBE_ONLY" | tee /tmp/lombardia-probe.txt
          else
            npx tsx scripts/places/lombardia/probe.ts --timeout "$PROBE_TIMEOUT_MS" | tee /tmp/lombardia-probe.txt
          fi
          {
            echo "### Import Places — Lombardia (probe diagnostico)"
            echo '```'
            cat /tmp/lombardia-probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Describe — dump di un record ArcGIS reale (diagnostica)
        if: ${{ inputs.mode == 'describe' }}
        run: |
          set -euo pipefail
          if [ -n "${DESCRIBE_NAME:-}" ]; then
            npx tsx scripts/places/lombardia/fetch.ts --describe --name "$DESCRIBE_NAME" | tee /tmp/lombardia-describe.txt
          else
            npx tsx scripts/places/lombardia/fetch.ts --describe | tee /tmp/lombardia-describe.txt
          fi
          {
            echo "### Import Places — Lombardia (describe)"
            echo "- Nome cercato: ${DESCRIBE_NAME:-(record arbitrario)}"
            echo '```json'
            cat /tmp/lombardia-describe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run — solo log, nessuna scrittura su Supabase
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          set -euo pipefail
          npx tsx scripts/places/lombardia/fetch.ts --dry-run --limit "$LIMIT" | tee /tmp/lombardia-dryrun.txt
          {
            echo "### Import Places — Lombardia (dry-run)"
            echo "- Limit: $LIMIT"
            echo '```json'
            cat /tmp/lombardia-dryrun.txt
            echo '```'
            echo ""
            echo "Verifica la distribuzione per subtype (quanto cade su 'altro') e le coordinate dell'esempio prima di passare a write."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write — import reale in dtrek_places/dtrek_place_sources
        if: ${{ inputs.mode == 'write' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "Secret Supabase mancanti nel repository — serve SUPABASE_URL e (SUPABASE_SERVICE_KEY o SUPABASE_SERVICE_ROLE_KEY). Vedi Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          npx tsx scripts/places/lombardia/fetch.ts --limit "$LIMIT" | tee /tmp/lombardia-write.txt
          {
            echo "### Import Places — Lombardia (write)"
            echo "- Limit: $LIMIT"
            echo '```json'
            cat /tmp/lombardia-write.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
