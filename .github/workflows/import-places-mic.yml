name: Import Places — MiC (ArCo → dtrek_places, meta_type=sito)

# Manuale (workflow_dispatch), stesso schema di import-places-istat.yml — leggere quel file prima
# di modificare questo, spiega le correzioni (Node 24 per le action, Node 22 per il client
# Supabase, fallback SUPABASE_SERVICE_ROLE_KEY) già applicate qui dall'inizio.
#
# Differenza importante rispetto a ISTAT: scripts/places/mic/fetch.ts interroga dal vivo
# l'endpoint SPARQL di ArCo (dati.cultura.gov.it) — nessun file da scaricare prima, ma anche
# nessuna opzione --to-json (il dry-run stampa solo un candidato di esempio + il conteggio nei log,
# non produce un artifact scaricabile).
#
# Punto aperto segnalato in scripts/places/mic/README.md: DUE tentativi di dedurre il predicato
# delle coordinate dall'ontologia hanno dato entrambi 0 risultati contro l'endpoint reale. La
# modalità "describe" dumpa la struttura REALE di un CulturalInstituteOrSite vero (nessun Supabase
# richiesto) — usarla per scrivere il prossimo fix leggendo dati osservati, non altra
# documentazione. Il dry-run supporta comunque --limit (5-20 per il primo test) per ispezionare un
# esempio prima di alzare il limite per un caricamento più ampio.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "describe: dump della struttura reale di un CIS (diagnostica). probe: test isolato di ogni predicato verificato (diagnostica, vedi scripts/places/mic/probe.ts). dry-run: solo log, nessuna scrittura. write: importa davvero in Supabase."
        required: true
        type: choice
        options:
          - describe
          - probe
          - dry-run
          - write
        default: dry-run
      all_italy:
        description: "Tutta Italia (ignora il campo Regione sotto, nessun filtro SPARQL). Il campo di testo di GitHub Actions arriva precompilato col default — svuotarlo non basta ad affidabilità, verificato dal vivo: usare questa checkbox invece di fidarsi del campo vuoto."
        required: false
        type: boolean
        default: false
      region:
        description: "Regione (es. Lazio). Ignorato se 'Tutta Italia' sopra è selezionato. Non usato in modalità probe."
        required: false
        type: string
        default: "Lazio"
      limit:
        description: "Numero massimo di risultati SPARQL. Piccolo (5-20) per il primo test delle coordinate, più alto per un caricamento vero. Non usato in modalità probe."
        required: false
        type: string
        default: "20"
      probe_timeout_ms:
        description: "Timeout (ms) per ciascun probe in modalità probe — un solo tentativo, nessuna retry."
        required: false
        type: string
        default: "30000"
      describe_name:
        description: "Solo modalità describe: testo da cercare in rdfs:label (es. 'Canepina') invece di un record arbitrario — vedi fetch.ts --describe --name."
        required: false
        type: string
        default: ""

concurrency:
  group: import-places
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode }}
      ALL_ITALY: ${{ inputs.all_italy }}
      REGION: ${{ inputs.region }}
      LIMIT: ${{ inputs.limit }}
      PROBE_TIMEOUT_MS: ${{ inputs.probe_timeout_ms }}
      DESCRIBE_NAME: ${{ inputs.describe_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Describe — dump della struttura reale di un CulturalInstituteOrSite (diagnostica)
        if: ${{ inputs.mode == 'describe' }}
        run: |
          set -euo pipefail
          if [ -n "${DESCRIBE_NAME:-}" ]; then
            npx tsx scripts/places/mic/fetch.ts --describe --name "$DESCRIBE_NAME" | tee /tmp/mic-describe.txt
          else
            npx tsx scripts/places/mic/fetch.ts --describe | tee /tmp/mic-describe.txt
          fi
          {
            echo "### Import Places — MiC (describe)"
            echo "- Nome cercato: ${DESCRIBE_NAME:-(record arbitrario)}"
            echo '```json'
            cat /tmp/mic-describe.txt
            echo '```'
            echo ""
            echo "Usare questo dump per scrivere il prossimo fix a buildSparqlQuery in scripts/places/mic/fetch.ts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe — test isolato di ogni predicato verificato (diagnostica temporanea, nessun Supabase, non tocca fetch.ts)
        if: ${{ inputs.mode == 'probe' }}
        run: |
          set -euo pipefail
          npx tsx scripts/places/mic/probe.ts --timeout "$PROBE_TIMEOUT_MS" | tee /tmp/mic-probe.txt
          {
            echo "### Import Places — MiC (probe diagnostico)"
            echo "Query minime (LIMIT 5), un tentativo ciascuna, per isolare quale predicato/join causa il timeout visto nella query di produzione — vedi scripts/places/mic/probe.ts per i predicati testati e le note di verifica."
            echo '```'
            cat /tmp/mic-probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run — solo log, nessuna scrittura su Supabase
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          set -euo pipefail
          EFFECTIVE_REGION="$REGION"
          if [ "$ALL_ITALY" = "true" ]; then EFFECTIVE_REGION=""; fi
          npx tsx scripts/places/mic/fetch.ts --dry-run --region "$EFFECTIVE_REGION" --limit "$LIMIT" | tee /tmp/mic-dryrun.txt
          {
            echo "### Import Places — MiC (dry-run)"
            echo "- Regione: ${EFFECTIVE_REGION:-tutta Italia}"
            echo "- Limit: $LIMIT"
            echo '```json'
            cat /tmp/mic-dryrun.txt
            echo '```'
            echo ""
            echo "Verifica le coordinate dell'esempio sopra (lat/lon plausibili per l'Italia) prima di alzare --limit o passare a write."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write — import reale in dtrek_places/dtrek_place_sources
        if: ${{ inputs.mode == 'write' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "Secret Supabase mancanti nel repository — serve SUPABASE_URL e (SUPABASE_SERVICE_KEY o SUPABASE_SERVICE_ROLE_KEY). Vedi Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          EFFECTIVE_REGION="$REGION"
          if [ "$ALL_ITALY" = "true" ]; then EFFECTIVE_REGION=""; fi
          npx tsx scripts/places/mic/fetch.ts --region "$EFFECTIVE_REGION" --limit "$LIMIT" | tee /tmp/mic-write.txt
          {
            echo "### Import Places — MiC (write)"
            echo "- Regione: ${EFFECTIVE_REGION:-tutta Italia}"
            echo "- Limit: $LIMIT"
            echo '```json'
            cat /tmp/mic-write.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
