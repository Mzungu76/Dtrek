name: Probe — Dimensione estratto Protomaps (PMTiles Italia, dry-run)

# Diagnostica pura: nessuna scrittura, nessun secret. Lancia `pmtiles extract --dry-run` sulla build
# pubblica Protomaps (https://build.protomaps.com) per il bbox scelto a più maxzoom e stampa nel
# riepilogo quanti tile / byte verrebbero scaricati. Serve a scegliere zoom e bbox PRIMA di caricare
# qualcosa su Cloudflare R2 (limite piano gratuito: 10 GB di storage).
#
# Gira su GitHub Actions perché la sandbox di sviluppo non raggiunge i server Protomaps.
# --dry-run legge solo l'header e le directory del PMTiles remoto (range request), non scarica i tile.

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "Bounding box min_lon,min_lat,max_lon,max_lat (default: Italia indicativa, include un po' di paesi vicini)."
        required: false
        type: string
        default: "6.6,35.4,18.6,47.1"
      maxzooms:
        description: "Elenco di maxzoom separati da spazio."
        required: false
        type: string
        default: "13 14 15"
      build_date:
        description: "Data build YYYYMMDD. Vuoto = la più recente disponibile negli ultimi 14 giorni."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BBOX: ${{ inputs.bbox }}
      MAXZOOMS: ${{ inputs.maxzooms }}
      BUILD_DATE: ${{ inputs.build_date }}
    steps:
      - name: Installa la CLI pmtiles (ultima release ufficiale go-pmtiles)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo protomaps/go-pmtiles \
            --pattern '*Linux_x86_64.tar.gz' --output pmtiles.tar.gz
          tar -xzf pmtiles.tar.gz pmtiles
          ./pmtiles version | tee /tmp/pmtiles-version.txt

      - name: Trova la build Protomaps
        run: |
          set -euo pipefail
          if [ -n "${BUILD_DATE:-}" ]; then
            URL="https://build.protomaps.com/${BUILD_DATE}.pmtiles"
            curl -fsSI "$URL" >/dev/null
          else
            URL=""
            for i in $(seq 0 14); do
              D=$(date -u -d "-${i} day" +%Y%m%d)
              if curl -fsSI "https://build.protomaps.com/${D}.pmtiles" >/dev/null 2>&1; then
                URL="https://build.protomaps.com/${D}.pmtiles"
                break
              fi
            done
            [ -n "$URL" ] || { echo "Nessuna build trovata negli ultimi 14 giorni" >&2; exit 1; }
          fi
          echo "SRC_URL=$URL" >> "$GITHUB_ENV"
          echo "Build usata: $URL"
          echo "Dimensione pianeta (Content-Length):"
          curl -fsSI "$URL" | grep -i '^content-length' || true

      - name: Aiuto CLI (conferma i flag di extract)
        run: ./pmtiles extract --help 2>&1 | tee /tmp/extract-help.txt

      - name: extract --dry-run per ogni maxzoom
        run: |
          set -uo pipefail
          : > /tmp/results.txt
          for Z in $MAXZOOMS; do
            echo "=== maxzoom $Z ===" | tee -a /tmp/results.txt
            ./pmtiles extract "$SRC_URL" /tmp/it-z$Z.pmtiles \
              --bbox="$BBOX" --maxzoom="$Z" --dry-run 2>&1 | tee -a /tmp/results.txt
            echo "" >> /tmp/results.txt
          done

      - name: Riepilogo
        if: always()
        run: |
          {
            echo "### Estratto Protomaps — dry-run"
            echo "- Sorgente: \`${SRC_URL:-?}\`"
            echo "- Bbox: \`$BBOX\`"
            echo "- CLI: \`$(cat /tmp/pmtiles-version.txt 2>/dev/null | head -1)\`"
            echo ""
            echo '```'
            cat /tmp/results.txt 2>/dev/null || echo "(nessun risultato)"
            echo '```'
            echo ""
            echo "Il limite del piano gratuito R2 è 10 GB di storage: il file scelto deve starci con margine."
          } >> "$GITHUB_STEP_SUMMARY"
