name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # docs/navigator-orizzonti-roadmap.md, Fase 3 — prima suite di test del repository
      # (lib/navigation/__tests__/), aggiunta qui invece che in un job separato: stesso
      # `npm ci` già fatto sopra, nessun costo aggiuntivo di installazione.
      - name: Test
        run: npm test
