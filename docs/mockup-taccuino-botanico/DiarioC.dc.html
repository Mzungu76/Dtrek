:root {
  --paper-base: #F5EDDD;
  --paper-light: #F9F2E4;
  --card: #EBE0C8;
  --card-border: #D9C9A8;
  --contour: #A89A78;
  --ink-typed: #2E2A22;
  --ink-hand: #7A6F52;
  --ink-muted: #95886A;
  --accent: #C0603D;
  --accent-2: #7C8F6E;
  --accent-tint: #E9DAC3;
  --bar-bg: #5F7355;
  --bar-active: #F5EDDD;
  --bar-inactive: #B9C4AE;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
.phone {

  background: var(--paper-base); font-family: 'DM Sans', system-ui, sans-serif;
  color: var(--ink-typed); -webkit-font-smoothing: antialiased;
}
.paper-grain {

    radial-gradient(circle at 55% 30%, rgba(46,42,34,.15) 0, rgba(46,42,34,.15) 1.1px, transparent 2.4px),

  background-size: 46px 52px, 61px 41px, 71px 83px, 33px 63px, 83px 47px, 53px 69px, 39px 59px, 67px 37px, 51px 73px;
}
.paper-imperfections {
  position: absolute; inset: 0; pointer-events: none; z-index: -1; mix-blend-mode: multiply;
  background-image:
    radial-gradient(ellipse 68px 46px at 15% 70%, rgba(122,111,82,.11), transparent 72%),

    radial-gradient(circle 1.3px at 30% 85%, rgba(46,42,34,.32), transparent 100%),
    radial-gradient(circle 1.4px at 90% 50%, rgba(46,42,34,.3), transparent 100%);
}
.tape {
  position: absolute; width: 34px; height: 13px; border-radius: 2px;
  background: var(--accent-tint);
  box-shadow: 0 1px 3px rgba(46,42,34,.2); z-index: 2;
}
.photo-obj {

.eyebrow {
  font-family: 'DM Sans', sans-serif; font-weight: 700; text-transform: uppercase;
  letter-spacing: .16em; font-size: 10.5px; color: var(--ink-muted);
}
.hand { font-family: 'Caveat', cursive; }
.display { font-family: 'Playfair Display', Georgia, serif; }
.narrative { font-family: 'Lora', Georgia, serif; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

.avatar-float {
  position: absolute; top: 22px; right: 18px; width: 38px; height: 38px; border-radius: 999px;
  background: rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.18); z-index: 5;
}
.avatar-float .inner {
  width: 32px; height: 32px; border-radius: 999px; background: var(--accent-tint);
  display: flex; align-items: center; justify-content: center; color: var(--accent);
  border: 2px solid var(--card-border);
}

.bottombar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 78px;
  background: var(--bar-bg); display: flex; align-items: center; justify-content: space-around;
  padding: 0 8px 10px; box-shadow: 0 -2px 12px rgba(0,0,0,.18); z-index: 6;
}
.bb-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--bar-inactive); }
.bb-item.active { color: var(--bar-active); }
.bb-label { font-size: 9.5px; font-weight: 700; letter-spacing: .01em; }

.bookbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 74px;
  background: var(--card); border-top: 1px solid var(--card-border);
  display: flex; align-items: stretch; justify-content: space-around; z-index: 6;
}
.bk-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-muted); }
.bk-label { font-family: 'DM Sans'; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 9px; }
.bk-item.accent { color: var(--accent); }

.book-header {
  padding: 20px 20px 10px; border-bottom: 1px solid var(--card-border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
}

.card {
  background: var(--card); border-radius: 14px; border: 1px solid var(--card-border);
  position: relative;
}
.card-dashed { border-style: dashed; }

.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700;
  padding: 4px 9px; border-radius: 999px; background: var(--accent-tint); color: var(--accent);
}
.badge-muted { background: var(--card); color: var(--ink-muted); border: 1px solid var(--card-border); }

.btn-primary {
  display: inline-flex; align-items: center; gap: 7px; background: var(--accent); color: var(--paper-light);
  font-weight: 700; font-size: 13px; padding: 11px 18px; border-radius: 12px; border: none;
}

.pill {
  display: inline-flex; align-items: center; gap: 6px; background: var(--paper-light); color: var(--ink-typed);
  font-size: 11px; font-weight: 600; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--card-border);
}

.settings-row {
  display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--card-border);
}
.settings-row .ic {
  width: 34px; height: 34px; border-radius: 10px; background: var(--accent-tint); color: var(--accent);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-2); }
