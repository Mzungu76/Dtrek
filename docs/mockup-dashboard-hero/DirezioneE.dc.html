<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400&family=DM+Sans:ital,wght@0,400;0,500;1,400&family=Barlow+Condensed:wght@600;700;900&family=Lora:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #fff; text-decoration: none; }
    .barlow { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; }
    .display { font-family: 'Playfair Display', Georgia, serif; }
    .body-f { font-family: 'DM Sans', system-ui, sans-serif; }
    .lora { font-family: 'Lora', Georgia, serif; }
    .glass { background: rgba(255,255,255,0.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.22); }
  </style>
</helmet>
<div class="body-f" style="width:390px;height:844px;background:#c9c0a4;position:relative;overflow:hidden;box-shadow:0 0 0 1px #dcd8cc;">

  <!-- ── Sfondo: UNA sola traccia in evidenza (l'ultima uscita, o la prossima in programma) — ruota
       come facevano le foto ambient della vecchia Bacheca, indicata dai puntini più sotto. ── -->
  <div style="position:absolute;inset:0;background:linear-gradient(155deg,#dcd4b8 0%,#c2b891 55%,#a89a70 100%);">
    <svg width="400" height="400" style="position:absolute;inset:0;opacity:0.3;mix-blend-mode:multiply;"><filter id="eGrain"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="400" height="400" filter="url(#eGrain)"/></svg>
    <svg viewBox="0 0 390 844" width="390" height="844" style="position:absolute;inset:0;">
      <circle cx="80" cy="150" r="2.4" fill="#8f8367"/><circle cx="260" cy="230" r="2" fill="#8f8367"/><circle cx="320" cy="480" r="2.4" fill="#8f8367"/>
      <circle cx="110" cy="560" r="1.8" fill="#8f8367"/><circle cx="200" cy="650" r="2" fill="#8f8367"/>
      <path d="M40 120 Q140 180 130 300 Q120 400 210 440 Q300 480 280 580 Q260 660 320 720"
        fill="none" stroke="#c05a17" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        style="filter:drop-shadow(0 3px 6px rgba(0,0,0,0.25));"/>
      <circle cx="40" cy="120" r="7" fill="#fff" stroke="#c05a17" stroke-width="3"/>
      <circle cx="320" cy="720" r="7" fill="#c05a17" stroke="#fff" stroke-width="3"/>
    </svg>
  </div>
  <div style="position:absolute;inset-x:0;top:0;height:200px;background:linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);pointer-events:none;"></div>
  <div style="position:absolute;inset-x:0;bottom:0;height:60%;background:linear-gradient(to top, rgba(11,26,36,0.88) 18%, rgba(11,26,36,0.4) 55%, transparent);pointer-events:none;"></div>

  <!-- ── HubNavBar ── -->
  <div style="position:relative;z-index:10;background:rgba(39,113,52,0.95);display:flex;align-items:center;gap:6px;padding:14px 12px 10px;">
    <div style="flex:1;display:flex;align-items:center;justify-content:space-around;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#ffffff;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span class="barlow" style="font-size:9px;font-weight:700;">Dashboard</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#8cc894;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="16 8 13 13 8 16 11 11"/></svg>
        <span class="barlow" style="font-size:9px;font-weight:700;">Guide</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#8cc894;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.6-1.1-4.2-1.6-6.2-1v13c2 0 4.7.5 6.2 1.6"/><path d="M12 6c1.6-1.1 4.2-1.6 6.2-1v13c-2 0-4.7.5-6.2 1.6z"/></svg>
        <span class="barlow" style="font-size:9px;font-weight:700;">Resoconti</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#8cc894;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
        <span class="barlow" style="font-size:9px;font-weight:700;">Diari</span>
      </div>
    </div>
    <div style="width:30px;height:30px;border-radius:999px;background:#20592b;border:2px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;">M</div>
  </div>

  <!-- ── Titolo magazine + chip "scheda attiva" (stessa modalità del contextBadge di Diari) ── -->
  <div style="position:relative;z-index:10;padding:16px 16px 0;">
    <span class="glass" style="display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:11px;font-weight:700;padding:6px 13px;border-radius:999px;margin-bottom:10px;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      Oggi <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
    </span>
    <h1 class="display" style="margin:0;font-weight:900;font-size:26px;letter-spacing:0.3px;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.55);line-height:1.05;">La tua ultima uscita</h1>
    <p class="lora" style="font-style:italic;font-size:14px;color:rgba(255,255,255,0.92);margin:4px 0 0;text-shadow:0 1px 6px rgba(0,0,0,0.5);">Anello di Calcata — 9,4 km, +410 m</p>
  </div>

  <!-- Puntini di rotazione (come le foto ambient della vecchia Bacheca) -->
  <div style="position:relative;z-index:10;display:flex;gap:5px;padding:12px 16px 0;">
    <span style="width:16px;height:4px;border-radius:99px;background:#fff;"></span>
    <span style="width:5px;height:4px;border-radius:99px;background:rgba(255,255,255,0.4);"></span>
    <span style="width:5px;height:4px;border-radius:99px;background:rgba(255,255,255,0.4);"></span>
  </div>

  <!-- ── Pannello fisso in basso: solo 2 widget chiave + maniglia "trascina per il resto" (stesso
       gesto di apertura di Guida/Resoconto/Diari — RouteCarousel/RoutePage) ── -->
  <div style="position:absolute;left:0;right:0;bottom:0;z-index:10;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);">
    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      <span class="barlow" style="font-size:9.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-top:1px;">Trascina per tutti i widget</span>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="glass" style="flex:1;border-radius:18px;padding:13px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:36px;height:36px;border-radius:999px;flex-shrink:0;background:conic-gradient(#e0a83c 0% 52%, rgba(255,255,255,0.15) 52% 100%);display:flex;align-items:center;justify-content:center;">
            <div style="width:27px;height:27px;border-radius:999px;background:rgba(11,26,36,0.9);display:flex;align-items:center;justify-content:center;">
              <span class="display" style="font-weight:700;font-size:10.5px;color:#fff;">52</span>
            </div>
          </div>
          <div class="barlow" style="font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,0.65);">Recovery</div>
        </div>
      </div>
      <div class="glass" style="flex:1;border-radius:18px;padding:13px;">
        <div class="barlow" style="font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,0.65);margin-bottom:4px;">Prossima uscita</div>
        <div class="display" style="font-weight:600;font-size:13px;color:#fff;">Dom 15 set</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
