<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400&family=DM+Sans:ital,wght@0,400;0,500;1,400&family=Barlow+Condensed:wght@600;700;900&family=Lora:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #fff; text-decoration: none; }
    .barlow { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; }
    .display { font-family: 'Playfair Display', Georgia, serif; }
    .body-f { font-family: 'DM Sans', system-ui, sans-serif; }
    .lora { font-family: 'Lora', Georgia, serif; }
    .glass { background: rgba(255,255,255,0.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.22); }
  </style>
</helmet>
<div class="body-f" style="width:390px;height:844px;background:#dfd8bf;position:relative;overflow:hidden;box-shadow:0 0 0 1px #dcd8cc;">

  <!-- ── Utente NUOVO (nessun percorso/Guida/Resoconto proprio) ma "Percorsi per te" ha già un
       suggerimento pronto (app/api/percorsi-per-te — generato al primo accesso). Niente selettore
       a due mappe qui: non c'è ancora nulla di "suo" da mostrare in due viste, solo il consiglio.
       Zoom volutamente più ampio ("regionale") della vista 1/2 di un utente con storico: un solo
       punto non giustifica uno zoom stretto, e un contesto più ampio comunica meglio "esplora qui
       vicino". ── -->
  <div style="position:absolute;inset:0;background:linear-gradient(160deg,#e4dec8 0%,#cdc4a6 55%,#b9ae8c 100%);">
    <svg width="400" height="400" style="position:absolute;inset:0;opacity:0.35;mix-blend-mode:multiply;"><filter id="esGrain"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="400" height="400" filter="url(#esGrain)"/></svg>
    <svg viewBox="0 0 390 700" width="390" height="700" style="position:absolute;top:0;left:0;">
      <!-- rilievo/contesto regionale generico: nessuna traccia dell'utente, solo la mappa di base -->
      <circle cx="60" cy="100" r="2" fill="#a89f83"/><circle cx="180" cy="60" r="1.8" fill="#a89f83"/><circle cx="320" cy="150" r="2.2" fill="#a89f83"/>
      <circle cx="40" cy="300" r="1.8" fill="#a89f83"/><circle cx="200" cy="260" r="2" fill="#a89f83"/><circle cx="340" cy="380" r="1.8" fill="#a89f83"/>
      <circle cx="100" cy="480" r="2" fill="#a89f83"/><circle cx="280" cy="560" r="1.8" fill="#a89f83"/><circle cx="150" cy="640" r="2.2" fill="#a89f83"/>
      <path d="M0 200 Q90 180 130 230 T260 210 Q340 200 390 240" fill="none" stroke="#a89f83" stroke-width="1.4" opacity="0.55"/>
      <path d="M0 420 Q100 440 170 400 T330 430" fill="none" stroke="#a89f83" stroke-width="1.4" opacity="0.55"/>

      <!-- l'UNICO percorso suggerito: stessa resa grafica di una traccia utente, per far capire che
           diventerà "sua" appena la percorre — start bianco, end pieno, come nelle viste con storico -->
      <path d="M120 130 Q210 190 195 300 Q185 390 260 440"
        fill="none" stroke="#c05a17" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        style="filter:drop-shadow(0 3px 6px rgba(0,0,0,0.25));"/>
      <circle cx="120" cy="130" r="7" fill="#fff" stroke="#c05a17" stroke-width="3"/>
      <circle cx="260" cy="440" r="7" fill="#c05a17" stroke="#fff" stroke-width="3"/>
    </svg>
  </div>
  <div style="position:absolute;inset:0;background:linear-gradient(160deg,rgba(129,54,25,0.14) 0%,rgba(28,71,36,0.1) 55%,rgba(7,24,36,0.16) 100%);pointer-events:none;"></div>
  <div style="position:absolute;inset-x:0;top:0;height:200px;background:linear-gradient(to bottom, rgba(0,0,0,0.62), transparent);pointer-events:none;"></div>
  <div style="position:absolute;inset-x:0;bottom:0;height:52%;background:linear-gradient(to top, rgba(11,26,36,0.9) 20%, rgba(11,26,36,0.4) 55%, transparent);pointer-events:none;"></div>

  <!-- ── HubNavBar ── -->
  <div style="position:relative;z-index:10;background:rgba(39,113,52,0.95);display:flex;align-items:center;gap:6px;padding:14px 12px 10px;">
    <div style="flex:1;display:flex;align-items:center;justify-content:space-around;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#ffffff;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span class="barlow" style="font-size:9px;font-weight:700;">Dashboard</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#8cc894;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="16 8 13 13 8 16 11 11"/></svg>
        <span class="barlow" style="font-size:9px;font-weight:700;">Guide</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#8cc894;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.6-1.1-4.2-1.6-6.2-1v13c2 0 4.7.5 6.2 1.6"/><path d="M12 6c1.6-1.1 4.2-1.6 6.2-1v13c-2 0-4.7.5-6.2 1.6z"/></svg>
        <span class="barlow" style="font-size:9px;font-weight:700;">Resoconti</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#8cc894;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
        <span class="barlow" style="font-size:9px;font-weight:700;">Diari</span>
      </div>
    </div>
    <div style="width:30px;height:30px;border-radius:999px;background:#20592b;border:2px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;">M</div>
  </div>

  <!-- ── Chip "Percorso consigliato" al posto del selettore a due mappe + titolo ── -->
  <div style="position:relative;z-index:10;padding:20px 16px 0;">
    <span class="glass" style="display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:11px;font-weight:700;padding:6px 13px;border-radius:999px;margin-bottom:10px;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polygon points="16 8 13 13 8 16 11 11"/></svg>
      Percorso consigliato per te
    </span>
    <h1 class="display" style="margin:0;font-weight:900;font-size:24px;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.55);line-height:1.05;">Il tuo primo percorso</h1>
    <p class="lora" style="font-style:italic;font-size:13.5px;color:rgba(255,255,255,0.92);margin:5px 0 0;text-shadow:0 1px 6px rgba(0,0,0,0.5);">Anello di Calcata — 9,4 km, +410 m · a 22 min da te</p>
  </div>

  <!-- ── In basso: CTA sul suggerimento (non ancora Recovery/Prossima uscita — non esistono per un
       utente senza storico) + lo stesso accesso rapido già usato nell'empty state completo. ── -->
  <div style="position:absolute;left:0;right:0;bottom:0;z-index:10;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 20px);">
    <a href="#" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;background:#377134;border-radius:14px;font-weight:600;font-size:14px;margin-bottom:12px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 3 3 8 12 13 21 8 12 3"/><polyline points="3 13 12 18 21 13"/></svg>
      Scopri il percorso
    </a>
    <div class="glass" style="border-radius:18px;padding:13px;display:flex;gap:10px;">
      <a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
        <span style="font-size:9.5px;font-weight:600;color:#fff;">Diario</span>
      </a>
      <a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 3 3 8 12 13 21 8 12 3"/><polyline points="3 13 12 18 21 13"/></svg>
        <span style="font-size:9.5px;font-weight:600;color:#fff;">Raccolte</span>
      </a>
      <a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.5 7-12a7 7 0 0 0-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <span style="font-size:9.5px;font-weight:600;color:#fff;">Percorsi</span>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
