<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lora:ital@0;1&family=Caveat:wght@600;700&family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
  :root{
    --paper:#F5EDDD; --paper-light:#F9F2E4; --card:#EBE0C8; --card-border:#D9C9A8;
    --ink:#2E2A22; --hand:#7A6F52; --hand-muted:#95886A;
    --accent:#C0603D; --sage:#7C8F6E;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);}
  .hand{font-family:'Caveat',cursive;color:rgba(46,42,34,.82);mix-blend-mode:multiply;text-shadow:0 0 2px rgba(122,90,50,.3);}
  .eyebrow{font-family:'Barlow Condensed';font-weight:700;font-size:9px;letter-spacing:.2em;text-transform:uppercase;}
  .lora-i{font-family:'Lora';font-style:italic;}
  .mono{font-family:'JetBrains Mono';}
</style>
</helmet>

<!-- Ultima pagina della stessa escursione (pag. 5 di 5): "Il percorso" (mappa + inquadramento in
     miniatura, DiarioReportPage.tsx righe 582-602) e la galleria foto numerata in fondo (righe
     604-620) — le foto qui sono la galleria completa, quelle sul grafico (pagina precedente) sono
     solo le 4 usate come marker di posizione. -->
<div style="width:390px;height:844px;position:relative;overflow:hidden;background-color:var(--paper);background-repeat:no-repeat;background-image:
  radial-gradient(ellipse 90% 84% at 50% 40%, transparent 55%, rgba(139,94,44,.15) 78%, rgba(139,94,44,.48) 100%),
  radial-gradient(ellipse 150px 115px at 78% 10%, rgba(249,242,228,.35), transparent 70%),
  radial-gradient(ellipse 140px 120px at 20% 70%, rgba(124,143,110,.07), transparent 68%);">

  <div style="position:absolute;inset-block:0;left:0;width:34px;z-index:30;pointer-events:none;
    background:linear-gradient(to right, rgba(41,35,30,0.48) 0%, rgba(41,35,30,0.48) 7%, rgba(128,103,70,0.36) 15%, rgba(41,35,30,0.17) 30%, transparent 60%);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);"></div>

  <div style="position:relative;z-index:10;padding:14px 20px 6px 44px;display:flex;align-items:center;justify-content:space-between;">
    <span class="eyebrow" style="color:var(--hand-muted);">Appennino Tosco-Emiliano &middot; Guida</span>
    <span class="mono" style="font-size:10px;color:var(--hand-muted);">pag. 5 di 5</span>
  </div>

  <div style="position:relative;z-index:5;padding:6px 20px 92px 44px;overflow:hidden;height:668px;">
    <h1 class="hand" style="font-size:32px;font-weight:700;line-height:1.02;margin:0 0 12px;">Il percorso</h1>

    <div style="position:relative;border:1.4px solid var(--sage);border-radius:8px 13px 7px 12px;overflow:hidden;margin-bottom:8px;background:var(--paper-light);">
      <!-- inquadramento in miniatura, in alto a destra come nel componente reale -->
      <div style="position:absolute;top:8px;right:8px;width:56px;height:56px;border-radius:7px;overflow:hidden;border:1.5px solid var(--paper-light);box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:2;background:#dde3d4;">
        <svg width="100%" height="100%" viewBox="0 0 56 56">
          <path d="M6,10 Q20,4 30,12 Q42,20 50,44 Q40,50 24,48 Q10,46 6,32 Z" fill="#c9d3bd"/>
          <circle cx="27" cy="26" r="3" fill="var(--accent)"/>
        </svg>
      </div>
      <svg width="100%" height="150" viewBox="0 0 322 150">
        <path d="M14,120 Q60,40 110,66 Q150,88 190,50 Q230,14 270,44 Q295,62 308,30"
          stroke="var(--accent)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <circle cx="14" cy="120" r="4.5" fill="var(--sage)"/>
        <circle cx="308" cy="30" r="4.5" fill="var(--accent)"/>
      </svg>
    </div>
    <p class="mono" style="font-size:9px;color:var(--hand-muted);text-align:center;margin:0 0 18px;">Partenza, arrivo e inquadramento generale</p>

    <p class="eyebrow" style="color:var(--hand-muted);margin:0 0 8px;">Foto</p>
    <sc-for list="{{foto}}" as="f" hint-placeholder-count="3">
      <div style="position:relative;margin-bottom:11px;">
        <div style="width:100%;aspect-ratio:4/3;border-radius:9px;background:{{f.bg}};"></div>
        <span style="position:absolute;top:7px;left:7px;width:20px;height:20px;border-radius:999px;background:var(--accent);color:#fff;font-family:'DM Sans';font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;">{{f.n}}</span>
        <p class="lora-i" style="font-size:11px;color:var(--hand);text-align:center;margin:5px 0 0;">{{f.caption}}</p>
      </div>
    </sc-for>
  </div>

  <div style="position:absolute;left:34px;right:0;bottom:0;z-index:20;background:var(--paper-light);border-top:1px solid var(--card-border);padding:10px 22px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;">
    <button style="display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--hand);font-family:'DM Sans';font-size:9.5px;font-weight:600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--hand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Indietro
    </button>
    <button style="display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--ink);font-family:'DM Sans';font-size:9.5px;font-weight:700;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Indice
    </button>
    <span class="eyebrow" style="color:var(--card-border);">Fine</span>
  </div>
</div>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      foto: [
        { n: 1, bg: 'linear-gradient(160deg,#8cc894,#20592b)', caption: 'Il crinale poco dopo il rifugio' },
        { n: 2, bg: 'linear-gradient(160deg,#e9ab64,#9f4315)', caption: 'Vista sulla vetta, ancora lontana' },
        { n: 3, bg: 'linear-gradient(160deg,#c4bead,#5e564c)', caption: 'La croce di vetta, quota 2.165 m' },
      ],
    }
  }
}
</script>
</x-dc>
</body>
</html>
