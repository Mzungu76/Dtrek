<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lora:ital@0;1&family=Caveat:wght@600;700&family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
  :root{ --accent:#e08d3c; --sage:#7C8F6E; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'DM Sans',sans-serif;color:#fff;}
  a{color:inherit;text-decoration:none;}
  .eyebrow{font-family:'Barlow Condensed';font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;}
  .lora-i{font-family:'Lora';font-style:italic;}
  .mono{font-family:'JetBrains Mono';}
  .display{font-family:'Playfair Display';font-weight:800;}
</style>
</helmet>

<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0b1a24;">

  <!-- copertina in primo piano, come la mensola di /diario -->
  <div style="position:relative;height:520px;background:linear-gradient(158deg,#193b20 0%,#1c4724 45%,#20592b 100%);overflow:hidden;">
    <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.07" viewBox="0 0 390 520" preserveAspectRatio="xMidYMid slice">
      <path d="M0,420 Q90,370 180,390 Q270,410 390,350" stroke="white" stroke-width="1" fill="none"/>
      <path d="M0,340 Q90,290 180,310 Q270,330 390,270" stroke="white" stroke-width="1" fill="none"/>
      <path d="M0,260 Q100,200 190,225 Q280,250 390,180" stroke="white" stroke-width="1" fill="none"/>
    </svg>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,24,14,0) 0%,rgba(8,24,14,0.15) 55%,rgba(8,24,14,0.82) 100%);"></div>

    <div style="position:absolute;top:0;left:0;right:0;padding:18px 18px 0;display:flex;align-items:center;justify-content:space-between;">
      <span style="display:flex;align-items:center;gap:7px;">
        <span style="color:var(--accent);font-size:15px;">&#9650;</span>
        <span class="eyebrow" style="color:rgba(255,255,255,.55);">DTrek</span>
      </span>
      <span class="eyebrow" style="background:rgba(255,255,255,.14);backdrop-filter:blur(4px);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:5px;">
        Tutte le Raccolte
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
    </div>

    <div style="position:absolute;left:20px;right:20px;bottom:24px;">
      <p class="eyebrow" style="color:var(--accent);margin:0 0 8px;">2023 &ndash; 2025</p>
      <h1 class="display" style="font-size:34px;line-height:1.05;margin:0 0 6px;color:#fff;">Appennino<br/>Tosco-Emiliano</h1>
      <p class="lora-i" style="font-size:13.5px;color:rgba(255,255,255,.6);margin:0 0 14px;">Crinali, faggete e rifugi</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <span class="mono" style="font-size:11px;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;">14 reportage</span>
        <span class="mono" style="font-size:11px;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;">187 km</span>
        <span class="mono" style="font-size:11px;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;">9.400 m D+</span>
      </div>
    </div>
  </div>

  <!-- invito ad apire -->
  <div style="display:flex;flex-direction:column;align-items:center;padding:10px 0 14px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    <span class="eyebrow" style="color:rgba(255,255,255,.4);margin-top:2px;">Apri il taccuino</span>
  </div>

  <!-- altri diari sullo scaffale -->
  <div style="padding:0 20px;display:flex;gap:10px;overflow:hidden;margin-bottom:20px;">
    <sc-for list="{{others}}" as="d" hint-placeholder-count="2">
      <div style="flex:1;min-width:0;border-radius:12px;overflow:hidden;position:relative;height:96px;background:{{d.bg}};">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%);"></div>
        <div style="position:absolute;left:10px;right:10px;bottom:8px;">
          <p class="display" style="font-size:14px;color:#fff;margin:0;line-height:1.15;">{{d.title}}</p>
          <p class="mono" style="font-size:9.5px;color:rgba(255,255,255,.6);margin:2px 0 0;">{{d.stats}}</p>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding:0 20px;">
    <p class="eyebrow" style="color:rgba(255,255,255,.35);margin:0 0 9px;">Raccolte</p>
    <div style="border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:11px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
      <div style="min-width:0;flex:1;">
        <p style="font-family:'DM Sans';font-weight:700;font-size:13.5px;color:#fff;margin:0;">In cammino sulle Alpi</p>
        <p style="font-family:'DM Sans';font-size:10.5px;color:rgba(255,255,255,.4);margin:2px 0 0;">2 taccuini in una collana</p>
      </div>
    </div>
    <p class="lora-i" style="font-size:11.5px;color:rgba(255,255,255,.3);text-align:center;margin:16px 0 0;">+ 1 reportage pubblicato da solo</p>
  </div>
</div>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      others: [
        { bg: 'linear-gradient(158deg,#132b19 0%,#1c4724 45%,#20592b 100%)', title: 'Alpi Marittime', stats: '6 reportage · 74 km' },
        { bg: 'linear-gradient(158deg,#6a2e18 0%,#813619 45%,#9f4315 100%)', title: 'Sentieri di casa', stats: '22 reportage · 138 km' },
      ],
    }
  }
}
</script>
</x-dc>
</body>
</html>
