<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lora:ital@0;1&family=Caveat:wght@600;700&family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
  :root{
    --paper:#F5EDDD; --paper-light:#F9F2E4; --card:#EBE0C8; --card-border:#D9C9A8; --contour:#A89A78;
    --ink:#2E2A22; --hand:#7A6F52; --hand-muted:#95886A;
    --accent:#C0603D; --sage:#7C8F6E; --tint:#E9DAC3;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);}
  a{color:var(--accent);text-decoration:none;}
  .hand{font-family:'Caveat',cursive;color:rgba(46,42,34,.82);mix-blend-mode:multiply;text-shadow:0 0 2px rgba(122,90,50,.3);}
  .eyebrow{font-family:'Barlow Condensed';font-weight:700;font-size:10px;letter-spacing:.24em;text-transform:uppercase;}
  .lora-i{font-family:'Lora';font-style:italic;}
  .mono{font-family:'JetBrains Mono';}
</style>
</helmet>

<div style="width:390px;height:844px;position:relative;overflow:hidden;background-color:var(--paper);background-image:
  radial-gradient(ellipse 90% 80% at 50% 38%, transparent 55%, rgba(139,94,44,.10) 80%, rgba(139,94,44,.30) 100%),
  radial-gradient(ellipse 150px 120px at 20% 12%, rgba(249,242,228,.5), transparent 70%),
  radial-gradient(ellipse 140px 130px at 78% 20%, rgba(122,111,82,.08), transparent 68%),
  radial-gradient(ellipse 150px 130px at 30% 70%, rgba(192,96,61,.05), transparent 68%),
  radial-gradient(ellipse 140px 120px at 85% 82%, rgba(124,143,110,.06), transparent 68%);
  background-repeat:no-repeat;">

  <!-- rilegatura -->
  <div style="position:absolute;inset-block:0;left:0;width:30px;z-index:20;pointer-events:none;
    background:linear-gradient(to right, rgba(41,35,30,0.46) 0%, rgba(41,35,30,0.46) 7%, rgba(128,103,70,0.34) 15%, rgba(41,35,30,0.16) 30%, transparent 60%);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);"></div>

  <!-- testata minima -->
  <div style="position:relative;padding:18px 22px 10px 40px;display:flex;align-items:center;justify-content:space-between;">
    <span style="display:flex;align-items:center;gap:7px;">
      <span style="color:var(--accent);font-size:14px;">&#9650;</span>
      <span class="eyebrow" style="color:var(--hand-muted);">DTrek</span>
    </span>
    <a href="#" style="font-family:'DM Sans';font-weight:700;font-size:10.5px;background:var(--accent);color:#fff;border-radius:999px;padding:6px 13px;">Prova DTrek</a>
  </div>

  <div style="position:relative;padding:6px 22px 0 40px;overflow:hidden;height:786px;">

    <!-- copertina / frontespizio -->
    <div style="position:relative;border:1.5px solid var(--accent);border-radius:9px 14px 8px 15px;background:var(--paper-light);padding:24px 22px 22px;margin-bottom:20px;">
      <p class="eyebrow" style="color:var(--accent);margin:0 0 8px;">Taccuino pubblico</p>
      <h1 class="hand" style="font-size:44px;font-weight:700;line-height:1;margin:0 0 6px;">Marco B.</h1>
      <svg width="120" height="16" viewBox="0 0 120 16" style="display:block;margin-bottom:10px;">
        <path d="M2,13 Q20,3 34,10 Q48,15 62,5 Q78,-2 92,9 Q106,15 118,6" stroke="var(--sage)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <p class="mono" style="font-size:12px;color:var(--hand);margin:0;">3 taccuini &middot; 42 uscite &middot; 399 km</p>
    </div>

    <p class="eyebrow" style="color:var(--hand-muted);margin:0 0 10px;">I taccuini</p>

    <sc-for list="{{diari}}" as="d" hint-placeholder-count="3">
      <div style="position:relative;display:flex;margin-bottom:14px;">
        <div style="width:7px;border-radius:3px;margin-right:11px;flex-shrink:0;background:{{d.ribbon}};box-shadow:1px 0 0 rgba(0,0,0,.06);"></div>
        <div style="flex:1;min-width:0;border:1.3px solid var(--card-border);border-radius:{{d.radius}};background:var(--card);padding:14px 16px;">
          <p class="eyebrow" style="color:{{d.ribbon}};margin:0 0 4px;">{{d.dates}}</p>
          <h3 class="hand" style="font-size:26px;font-weight:600;line-height:1.05;margin:0 0 3px;color:rgba(46,42,34,.85);">{{d.title}}</h3>
          <p class="lora-i" style="font-size:12.5px;color:var(--hand);margin:0 0 8px;">{{d.subtitle}}</p>
          <p class="mono" style="font-size:11px;color:var(--ink);margin:0;">{{d.stats}}</p>
        </div>
      </div>
    </sc-for>

    <p class="eyebrow" style="color:var(--hand-muted);margin:22px 0 10px;">Raccolte</p>
    <div style="border:1.3px dashed var(--contour);border-radius:10px;padding:13px 16px;display:flex;align-items:center;gap:12px;margin-bottom:18px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
      <div style="min-width:0;flex:1;">
        <p class="hand" style="font-size:19px;margin:0;color:rgba(46,42,34,.8);">In cammino sulle Alpi</p>
        <p style="font-family:'DM Sans';font-size:11px;color:var(--hand-muted);margin:2px 0 0;">2 taccuini in una collana</p>
      </div>
    </div>

    <p style="font-family:'Lora';font-style:italic;font-size:12px;color:var(--hand-muted);text-align:center;margin:0;">+ 1 reportage pubblicato da solo</p>
  </div>
</div>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      diari: [
        { ribbon: '#C0603D', radius: '6px 12px 5px 13px', dates: '2023 – 2025',
          title: 'Appennino Tosco-Emiliano', subtitle: 'Crinali, faggete e rifugi',
          stats: '14 escursioni · 187 km · 9.400 m D+' },
        { ribbon: '#7C8F6E', radius: '12px 6px 13px 5px', dates: '2024 – 2025',
          title: 'Alpi Marittime', subtitle: 'Tra le Alpi e il mare',
          stats: '6 escursioni · 74 km · 4.100 m D+' },
        { ribbon: '#A89A78', radius: '7px 11px 6px 12px', dates: '2022 – 2025',
          title: 'Sentieri di casa', subtitle: 'Weekend brevi nel Mugello',
          stats: '22 escursioni · 138 km · 6.900 m D+' },
      ],
    }
  }
}
</script>
</x-dc>
</body>
</html>
