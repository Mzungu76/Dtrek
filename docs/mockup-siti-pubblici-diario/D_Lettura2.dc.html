<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lora:ital@0;1&family=Caveat:wght@600;700&family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
  :root{
    --paper:#F5EDDD; --paper-light:#F9F2E4; --card:#EBE0C8; --card-border:#D9C9A8;
    --ink:#2E2A22; --hand:#7A6F52; --hand-muted:#95886A;
    --accent:#C0603D; --sage:#7C8F6E; --tint:#E9DAC3;
    --hr:#a8493a; --hr-bg:#f3e6dd; --speed:#4d6f8a; --speed-bg:#e3ebee;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);}
  .hand{font-family:'Caveat',cursive;color:rgba(46,42,34,.82);mix-blend-mode:multiply;text-shadow:0 0 2px rgba(122,90,50,.3);}
  .eyebrow{font-family:'Barlow Condensed';font-weight:700;font-size:9px;letter-spacing:.2em;text-transform:uppercase;}
  .mono{font-family:'JetBrains Mono';}
</style>
</helmet>

<!-- Continua D_Lettura (pag. 3 di 5) sulla stessa escursione. Struttura presa da
     components/diario/DiarioReportPage.tsx, righe 540-581: StatCard, poi "Profilo altimetrico" con
     i marker delle foto POSIZIONATI SUL GRAFICO (non sulla mappa — la differenza rispetto al
     vecchio sito pubblico /leggi), poi Frequenza cardiaca e Velocità. -->
<div style="width:390px;height:844px;position:relative;overflow:hidden;background-color:var(--paper);background-repeat:no-repeat;background-image:
  radial-gradient(ellipse 90% 84% at 50% 40%, transparent 55%, rgba(139,94,44,.15) 78%, rgba(139,94,44,.48) 100%),
  radial-gradient(ellipse 150px 115px at 20% 12%, rgba(249,242,228,.35), transparent 70%),
  radial-gradient(ellipse 140px 120px at 80% 64%, rgba(122,111,82,.09), transparent 68%);">

  <div style="position:absolute;inset-block:0;left:0;width:34px;z-index:30;pointer-events:none;
    background:linear-gradient(to right, rgba(41,35,30,0.48) 0%, rgba(41,35,30,0.48) 7%, rgba(128,103,70,0.36) 15%, rgba(41,35,30,0.17) 30%, transparent 60%);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);"></div>

  <div style="position:relative;z-index:10;padding:14px 20px 6px 44px;display:flex;align-items:center;justify-content:space-between;">
    <span class="eyebrow" style="color:var(--hand-muted);">Appennino Tosco-Emiliano &middot; Guida</span>
    <span class="mono" style="font-size:10px;color:var(--hand-muted);">pag. 4 di 5</span>
  </div>

  <div style="position:relative;z-index:5;padding:6px 20px 92px 44px;overflow:hidden;height:668px;">
    <h1 class="hand" style="font-size:32px;font-weight:700;line-height:1.02;margin:0 0 12px;">Dati e grafici</h1>

    <!-- Statistiche -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;">
      <div style="background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:9px 11px;">
        <p class="mono" style="font-size:15px;margin:0;color:var(--ink);">12,4 km</p>
        <p class="eyebrow" style="font-size:8px;color:var(--hand-muted);margin:2px 0 0;">Distanza</p>
      </div>
      <div style="background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:9px 11px;">
        <p class="mono" style="font-size:15px;margin:0;color:var(--ink);">850 m</p>
        <p class="eyebrow" style="font-size:8px;color:var(--hand-muted);margin:2px 0 0;">Dislivello D+</p>
      </div>
      <div style="background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:9px 11px;">
        <p class="mono" style="font-size:15px;margin:0;color:var(--ink);">4h20</p>
        <p class="eyebrow" style="font-size:8px;color:var(--hand-muted);margin:2px 0 0;">Durata</p>
      </div>
      <div style="background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:9px 11px;">
        <p class="mono" style="font-size:15px;margin:0;color:var(--ink);">620</p>
        <p class="eyebrow" style="font-size:8px;color:var(--hand-muted);margin:2px 0 0;">Calorie (kcal)</p>
      </div>
    </div>

    <!-- Profilo altimetrico con posizione foto -->
    <p class="eyebrow" style="color:var(--hand-muted);margin:0 0 6px;">Profilo altimetrico &middot; con posizione foto</p>
    <div style="background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:12px 10px 8px;margin-bottom:16px;position:relative;">
      <svg width="100%" height="88" viewBox="0 0 330 88">
        <path d="M4,70 C40,58 55,30 82,26 C115,20 130,52 165,50 C200,48 210,18 245,14 C275,10 295,40 326,32"
          stroke="var(--accent)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <!-- marker delle foto: cerchietti sulla linea, non sulla mappa -->
        <sc-for list="{{fotoMarkers}}" as="m" hint-placeholder-count="4">
          <g>
            <circle cx="{{m.x}}" cy="{{m.y}}" r="7.5" fill="var(--paper-light)" stroke="var(--accent)" stroke-width="1.6"/>
            <svg x="{{m.iconX}}" y="{{m.iconY}}" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.2"/><path d="M8 7l1.5-2.5h5L16 7"/></svg>
          </g>
        </sc-for>
      </svg>
      <p class="mono" style="font-size:9px;color:var(--hand-muted);text-align:center;margin:2px 0 0;">2.165 m quota massima</p>
    </div>

    <!-- Frequenza cardiaca -->
    <p class="eyebrow" style="color:var(--hand-muted);margin:0 0 6px;">Frequenza cardiaca</p>
    <div style="background:var(--hr-bg);border:1px solid #d9b8ac;border-radius:10px;padding:10px;margin-bottom:14px;">
      <svg width="100%" height="46" viewBox="0 0 330 46">
        <path d="M4,30 C40,22 60,14 90,20 C125,27 150,10 185,16 C220,22 250,8 290,18 L326,22"
          stroke="var(--hr)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <p class="mono" style="font-size:9px;color:#8a5045;text-align:center;margin:2px 0 0;">128 bpm media</p>
    </div>

    <!-- Velocità -->
    <p class="eyebrow" style="color:var(--hand-muted);margin:0 0 6px;">Velocit&agrave;</p>
    <div style="background:var(--speed-bg);border:1px solid #b9c9d2;border-radius:10px;padding:10px;">
      <svg width="100%" height="46" viewBox="0 0 330 46">
        <path d="M4,26 C40,30 60,34 90,24 C125,14 150,22 185,18 C220,14 250,26 290,20 L326,16"
          stroke="var(--speed)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <p class="mono" style="font-size:9px;color:#4c6274;text-align:center;margin:2px 0 0;">2,9 km/h media</p>
    </div>
  </div>

  <div style="position:absolute;left:34px;right:0;bottom:0;z-index:20;background:var(--paper-light);border-top:1px solid var(--card-border);padding:10px 22px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;">
    <button style="display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--hand);font-family:'DM Sans';font-size:9.5px;font-weight:600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--hand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Indietro
    </button>
    <button style="display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--ink);font-family:'DM Sans';font-size:9.5px;font-weight:700;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Indice
    </button>
    <button style="display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--accent);font-family:'DM Sans';font-size:9.5px;font-weight:700;">
      Avanti
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</div>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    // Posizioni lette a occhio dalla curva SVG sopra, cx/cy sulla linea, icona centrata nel cerchio
    const pts = [
      { x: 82,  y: 26 },
      { x: 165, y: 50 },
      { x: 245, y: 14 },
      { x: 300, y: 24 },
    ]
    return {
      fotoMarkers: pts.map(p => ({ x: p.x, y: p.y, iconX: p.x - 4.5, iconY: p.y - 4.5 })),
    }
  }
}
</script>
</x-dc>
</body>
</html>
