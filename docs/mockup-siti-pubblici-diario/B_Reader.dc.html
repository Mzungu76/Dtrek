<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lora:ital@0;1&family=Caveat:wght@600;700&family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
  :root{
    --paper:#F5EDDD; --paper-light:#F9F2E4; --card:#EBE0C8; --card-border:#D9C9A8;
    --ink:#2E2A22; --hand:#7A6F52; --hand-muted:#95886A;
    --accent:#C0603D; --sage:#7C8F6E; --tint:#E9DAC3;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);}
  .hand{font-family:'Caveat',cursive;color:rgba(46,42,34,.82);mix-blend-mode:multiply;text-shadow:0 0 2px rgba(122,90,50,.3);}
  .eyebrow{font-family:'Barlow Condensed';font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;}
  .mono{font-family:'JetBrains Mono';}
</style>
</helmet>

<div style="width:390px;height:844px;position:relative;overflow:hidden;background-color:var(--paper);background-image:
  radial-gradient(ellipse 90% 80% at 50% 38%, transparent 55%, rgba(139,94,44,.10) 80%, rgba(139,94,44,.30) 100%),
  radial-gradient(ellipse 150px 120px at 20% 10%, rgba(249,242,228,.5), transparent 70%);
  background-repeat:no-repeat;">

  <div style="position:absolute;inset-block:0;left:0;width:28px;z-index:30;pointer-events:none;
    background:linear-gradient(to right, rgba(41,35,30,0.46) 0%, rgba(41,35,30,0.46) 7%, rgba(128,103,70,0.34) 15%, rgba(41,35,30,0.16) 30%, transparent 60%);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);"></div>

  <div style="position:relative;z-index:10;padding:18px 20px 4px 38px;">
    <p class="eyebrow" style="color:var(--hand-muted);margin:0 0 3px;">Indice del taccuino</p>
    <h1 class="hand" style="font-size:32px;font-weight:700;margin:0;color:rgba(46,42,34,.85);">Appennino Tosco-Emiliano</h1>
  </div>

  <div style="position:relative;z-index:10;padding:12px 20px 8px 38px;display:flex;gap:7px;">
    <span style="background:var(--accent);color:#fff;font-family:'DM Sans';font-weight:700;font-size:11px;border-radius:999px;padding:5px 12px;">Tutte</span>
    <span style="background:var(--card);color:var(--hand);font-family:'DM Sans';font-weight:600;font-size:11px;border-radius:999px;padding:5px 12px;border:1px solid var(--card-border);">Preferite</span>
    <span style="margin-left:auto;color:var(--hand-muted);font-family:'DM Sans';font-weight:600;font-size:11px;display:flex;align-items:center;gap:3px;">
      Data
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </span>
  </div>

  <div style="position:relative;z-index:5;padding:6px 20px 90px 38px;overflow:hidden;height:640px;">
    <sc-for list="{{righe}}" as="r" hint-placeholder-count="6">
      <div style="display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;margin-bottom:2px;background:{{r.tint}};">
        <div style="width:52px;height:52px;border-radius:9px;flex-shrink:0;border:1.2px solid var(--card-border);background:var(--card);display:flex;align-items:center;justify-content:center;">
          <svg width="30" height="30" viewBox="0 0 30 30"><path d="M3,24 Q9,10 15,16 Q21,22 27,6" stroke="var(--accent)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </div>
        <div style="min-width:0;flex:1;">
          <p style="font-family:'DM Sans';font-weight:700;font-size:13.5px;color:var(--ink);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{r.title}}</p>
          <p class="mono" style="font-size:10.5px;color:var(--hand-muted);margin:2px 0 0;">{{r.stats}}</p>
        </div>
        <div style="width:26px;height:26px;border-radius:999px;border:2px solid {{r.ring}};flex-shrink:0;display:flex;align-items:center;justify-content:center;">
          <span class="mono" style="font-size:9px;color:{{r.ring}};">{{r.score}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position:absolute;left:28px;right:0;bottom:0;z-index:20;background:var(--paper-light);border-top:1px solid var(--card-border);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;">
    <button style="display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--hand);font-family:'DM Sans';font-size:9.5px;font-weight:600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--hand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Indietro
    </button>
    <button style="display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--accent);font-family:'DM Sans';font-size:9.5px;font-weight:700;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Indice
    </button>
    <button style="display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--hand);font-family:'DM Sans';font-size:9.5px;font-weight:600;">
      Avanti
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--hand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</div>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { title: 'Monte Cimone da Pian Cavallaro', stats: '12,4 km · 850 m D+', score: '82', ring: '#C0603D', tinted: true },
      { title: 'Corno alle Scale, anello nord', stats: '9,1 km · 620 m D+', score: '74', ring: '#7C8F6E', tinted: true },
      { title: 'Lago Scaffaiolo dal Passo', stats: '7,8 km · 410 m D+', score: '68', ring: '#7C8F6E', tinted: false },
      { title: "Alpe Tre Potenze", stats: '11,2 km · 780 m D+', score: '79', ring: '#C0603D', tinted: true },
      { title: 'Sasso Tetto, cresta sud', stats: '8,4 km · 540 m D+', score: '71', ring: '#7C8F6E', tinted: false },
      { title: 'Monte Cusna da Febbio', stats: '13,6 km · 920 m D+', score: '85', ring: '#C0603D', tinted: true },
    ]
    return { righe: rows.map(r => ({ ...r, tint: r.tinted ? 'rgba(192,96,61,0.07)' : 'transparent' })) }
  }
}
</script>
</x-dc>
</body>
</html>
